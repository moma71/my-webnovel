<!DOCTYPE html>
<!-- refresh test -->

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do, 85% - Web Novel</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* 에피소드 상태 스타일 */
        .episode-draft {
            opacity: 0.5;
        }
        .episode-draft::after {
            content: " (작성중)";
            font-size: 14px;
            color: #777;
        }
    </style>

</head>
<body>

    <header class="site-header">
        <div class="nav-inner">
            <div class="brand">
                <a href="index.html" class="logo">📘 Do, 85%</a>
            </div>
            
            <nav class="main-nav" id="main-menu">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </nav>
            
            <button class="nav-toggle" aria-controls="main-menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <div class="hero">
        <h1>Do, 85%</h1>
        <p>현장 중심 리얼리즘 × AI 실무 튜토리얼 웹소설 프로젝트</p>
        <button onclick="location.href='#episodes'">에피소드 바로 보기</button>
    </div>

    <section id="episodes" class="container episode-section">
        <div class="episode-title">📖 에피소드 목록</div>
        <div id="episode-grid" class="episode-grid"></div>
    </section>

    <script>
        // 자동 Episode 버튼 생성 로직
        const maxEpisodes = 20; // 원하는 숫자까지 자동 생성
        const grid = document.getElementById("episode-grid");

        for (let i = 1; i <= maxEpisodes; i++) {

            const episodePath = `episode${i}/index.html`;

            // 생성 버튼
            const link = document.createElement("a");
            link.className = "episode-btn";
            link.textContent = `Episode ${i}`;
            link.href = episodePath;

            // fetch로 파일 존재 여부 확인
            fetch(episodePath, { method: "HEAD" })
                .then(response => {
                    if (!response.ok) {
                        link.classList.add("episode-draft");
                        link.href = "#"; 
                    }
                })
                .catch(() => {
                    link.classList.add("episode-draft");
                    link.href = "#";
                });

            grid.appendChild(link);
        }

        // 모바일 메뉴
        const toggleButton = document.querySelector('.nav-toggle');
        const mainNav = document.getElementById('main-menu');
        
        toggleButton.addEventListener('click', () => {
            const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true';
            toggleButton.setAttribute('aria-expanded', !isExpanded);
            mainNav.classList.toggle('show');
        });
    </script>

</body>
</html>
