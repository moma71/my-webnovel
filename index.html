<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do, 85% - Web Novel</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: "Pretendard", sans-serif;
            background: #f2f3f7;
        }

        /* ---------- NAVBAR ---------- */
        nav {
            width: 100%;
            background: white;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            border-bottom: 1px solid #e1e1e1;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 16px;
        }

        .nav-right a {
            text-decoration: none;
            color: #333;
        }

        /* ---------- HERO SECTION ---------- */
        .hero {
            width: 100%;
            background: linear-gradient(145deg, #6e8df5, #88a8ff);
            padding: 80px 20px;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero p {
            margin-top: 0;
            font-size: 20px;
        }

        .hero button {
            margin-top: 25px;
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .hero button:hover {
            transform: scale(1.05);
        }

        /* ---------- EPISODE LIST ---------- */
        .episode-section {
            width: 100%;
            padding: 60px 20px;
            text-align: center;
        }

        .episode-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .episode-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        .episode-btn {
            background: #5279ff;
            color: white;
            padding: 15px 35px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            transition: 0.2s;
            display: inline-block;
        }

        .episode-btn:hover {
            background: #325ce6;
            transform: translateY(-3px);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 34px;
            }
            .hero p {
                font-size: 16px;
            }
            nav {
                padding: 0 10px;
            }
            .nav-right {
                gap: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-left">
            📘 <span>Do, 85%</span>
        </div>
        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <!-- HERO BANNER -->
    <div class="hero">
        <h1>Do, 85%</h1>
        <p>현장 중심 리얼리즘 × AI 실무 튜토리얼 웹소설 프로젝트</p>
        <button onclick="location.href='#episodes'">에피소드 바로 보기</button>
    </div>

    <!-- EPISODE LIST -->
    <section id="episodes" class="episode-section">
        <div class="episode-title">📖 에피소드 목록</div>

        <div class="episode-grid">
            <a class="episode-btn" href="episode1/index.html">Episode 1</a>
            <a class="episode-btn" href="episode2/index.html">Episode 2</a>
            <a class="episode-btn" href="episode3/index.html">Episode 3</a>
            <a class="episode-btn" href="episode4/index.html">Episode 4</a>
            <a class="episode-btn" href="episode5/index.html">Episode 5</a>
            <a class="episode-btn" href="episode6/index.html">Episode 6</a>
            <a class="episode-btn" href="episode7/index.html">Episode 7</a>
        </div>
    </section>

</body>
</html>
