<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do, 85% - Web Novel</title>
    <link rel="stylesheet" href="style.css">
    </head>

<body>

    <header class="site-header">
        <div class="nav-inner">
            <div class="brand">
                <a href="index.html" class="logo">📘 Do, 85%</a>
            </div>
            
            <nav class="main-nav" id="main-menu">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </nav>
            
            <button class="nav-toggle" aria-controls="main-menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div class="hero">
        <h1>Do, 85%</h1>
        <p>현장 중심 리얼리즘 × AI 실무 튜토리얼 웹소설 프로젝트</p>
        <button onclick="location.href='#episodes'">에피소드 바로 보기</button>
    </div>

    <section id="episodes" class="container episode-section">
        <div class="episode-title">📖 에피소드 목록</div>

        <div class="episode-grid">
            <a class="episode-btn" href="episode1/index.html">Episode 1</a>
            <a class="episode-btn" href="episode2/index.html">Episode 2</a>
            <a class="episode-btn" href="episode3/index.html">Episode 3</a>
            <a class="episode-btn" href="episode4/index.html">Episode 4</a>
            <a class="episode-btn" href="episode5/index.html">Episode 5</a>
            <a class="episode-btn" href="episode6/index.html">Episode 6</a>
            <a class="episode-btn" href="episode7/index.html">Episode 7</a>
        </div>
    </section>

    <script>
        // 햄버거 메뉴 토글 로직
        const toggleButton = document.querySelector('.nav-toggle');
        const mainNav = document.getElementById('main-menu');
        
        toggleButton.addEventListener('click', () => {
            const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true' || false;
            toggleButton.setAttribute('aria-expanded', !isExpanded);
            mainNav.classList.toggle('show');
        });
    </script>

</body>
</html>
